        - generic [ref=e392]:
          - paragraph [ref=e393]: Have a unique job, or too busy to browse for freelancers? Post a buyer request in our tailor-made Exchange section!
          - paragraph [ref=e394]: Just provide a description, delivery time, and budget. Kwork's seasoned freelancers will send in bespoke offers customized to your task. Best suited for complex or large projects.
          - paragraph [ref=e395]: The quality of offers on Kwork is unique. Thanks to a proprietary feature on our platform, you don't need to sift through a sea of generic offers you might receive on other freelance platforms. Since Kwork professionals are rewarded for putting special thought and effort into every offer, you get to choose from the crème de la crème.
